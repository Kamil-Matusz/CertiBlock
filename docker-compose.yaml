version: '3.9'

services:
  postgres:
    image: postgres
    shm_size: '4gb'
    container_name: certiBlock_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=CertiBlock
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: certiBlock_mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    ports:
      - 27017:27017
    volumes:
      - mongo:/data/db

volumes:
  postgres:
    driver: local
  mongo:
    driver: local