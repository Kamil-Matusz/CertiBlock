services:
  postgres:
    image: postgres
    shm_size: '4gb'
    container_name: certiBlock_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=CertiBlock
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: certiBlock_mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    ports:
      - 27017:27017
    volumes:
      - mongo:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: certiBlock_rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

volumes:
  postgres:
    driver: local
  mongo:
    driver: local
  rabbitmq:
    driver: local