name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore CertiBlock.sln

      - name: Build the project
        run: dotnet build CertiBlock.sln --no-restore

      - name: Run tests
        run: dotnet test CertiBlock.sln --no-build --verbosity normal

      - name: Post-build steps
        if: always()
        run: echo "Backend build and test completed"
